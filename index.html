<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PROJECT:RENAISSANCE</title>
  <link rel="icon" type="image/png" href="assets/favicon/homepage.png">
  <link rel="stylesheet" href="assets/font/font.css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="components/titlehero/titlehero-loader.js"></script>
  <script src="components/navbar/navbar-loader.js"></script>
  <script src="components/cart/cart-loader.js"></script>
  <style type="text/tailwindcss">
    @layer components {
          .background { @apply fixed inset-0 w-screen h-screen object-cover pointer-events-none transition-opacity duration-800; }
          .copyright { @apply fixed bottom-6 left-1/2 -translate-x-1/2 mix-blend-difference text-white text-sm tracking-tight z-50; }
          .social-link { @apply fixed bottom-6 right-20 -translate-x-1/2 mix-blend-difference text-white tracking-tight uppercase hover:text-white/60 z-50; }
        }
  </style>
</head>
<body class="bg-black select-none">
  <img id="bg-image" src="assets/homepage.jpeg" class="background"/>
  <div class="copyright">
    <p>© 2026 SENPPIE</p>
  </div>
  <div class="social-link">
    <a href="https://github.com/senppie/project-renaissance">Github</a>
  </div>
</body>
<script>
  const backgrounds = [
    'assets/homepage.jpeg',
    'assets/visualspage/visual-11.jpg',
    'assets/tourpage/tour-bg-04.jpeg',
    'assets/visualspage/booklet/visual-purehoney-3.jpg',
    'assets/visualspage/visual-07.jpg',
    'assets/tourpage/05london.jpg',
    'assets/visualspage/booklet/visual-allupinyourmind.jpg',
    'assets/tourpage/tour-bg-09.jpeg',
    'assets/visualspage/visual-10.jpg',
    'assets/tourpage/11warsaw.jpg',
    'assets/visualspage/booklet/visual-plasticoofthesofa-1.jpg',
    'assets/tourpage/04paris.jpg',
    'assets/visualspage/visual-purehoney-1.jpg',
    'assets/tourpage/tour-bg-01.jpeg',
    'assets/visualspage/visual-17.jpg',
    'assets/tourpage/22las-vegas.jpg',
    'assets/tourpage/tour-bg-07.jpeg',
    'assets/visualspage/visual-05.jpg',
    'assets/tourpage/tour-bg-10.jpeg',
    'assets/tourpage/tour-bg-03.jpeg',
    'assets/visualspage/visual-09.jpg',
    'assets/tourpage/tour-bg-08.jpeg',
    'assets/tourpage/tour-bg-05.jpeg',
  ];

  let currentBgIndex = 0;
  const bgImage = document.getElementById('bg-image');

  setInterval(() => {
    bgImage.style.opacity = '0';

    setTimeout(() => {
      currentBgIndex = (currentBgIndex + 1) % backgrounds.length;
      bgImage.src = backgrounds[currentBgIndex];
      bgImage.style.opacity = '1';
    }, 800);
  }, 12000);
</script>
</html>
