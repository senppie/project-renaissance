<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PROJECT:RENAISSANCE</title>
  <link rel="icon" type="image/png" href="assets/favicon/homepage.png">
  <link rel="stylesheet" href="assets/font/font.css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="components/titlehero/titlehero-loader.js"></script>
  <script src="components/navbar/navbar-loader.js"></script>
  <script src="components/cart/cart-loader.js"></script>
  <style type="text/tailwindcss">
    @layer components {
          .background { @apply fixed inset-0 w-screen h-screen object-cover pointer-events-none transition-opacity duration-800; }
          .copyright { @apply fixed bottom-6 left-1/2 -translate-x-1/2 mix-blend-difference text-white text-sm tracking-tight z-50; }
          .social-link { @apply fixed bottom-6 right-20 -translate-x-1/2 mix-blend-difference text-white tracking-tight uppercase hover:text-white/60 z-50; }
        }
  </style>
</head>
<body class="bg-black select-none">
  <img id="bg-image" src="assets/homepage.jpeg" class="background"/>
  <div class="copyright">
    <p>© 2026 SENPPIE</p>
  </div>
  <div class="social-link">
    <a href="https://github.com/senppie/project-renaissance">Github</a>
  </div>
</body>
<script>
  const backgrounds = [
    'assets/homepage.jpeg',
    'assets/tourpage/05.jpg',
    'assets/visualspage/07.jpg',
    'assets/tourpage/41.jpeg',
    'assets/visualspage/purehoney-3.jpg',
    'assets/tourpage/16.jpg',
    'assets/visualspage/02.jpg',
    'assets/tourpage/37.jpeg',
    'assets/visualspage/energy-1.jpg',
    'assets/visualspage/11.jpg',
    'assets/tourpage/43.jpeg',
    'assets/visualspage/plasticoofthesofa-1.jpg',
    'assets/tourpage/24.jpg',
    'assets/visualspage/09.jpg',
    'assets/tourpage/33.jpg',
    'assets/visualspage/allupinyourmind.jpg',
    'assets/tourpage/13.jpg',
    'assets/visualspage/05.jpg',
    'assets/tourpage/39.jpeg',
    'assets/visualspage/thique-2.jpg',
    'assets/tourpage/44.jpeg',
    'assets/tourpage/31.jpg',
    'assets/tourpage/15.jpg',
    'assets/visualspage/10.jpg',
  ];

  let currentBgIndex = 0;
  const bgImage = document.getElementById('bg-image');

  setInterval(() => {
    bgImage.style.opacity = '0';

    setTimeout(() => {
      currentBgIndex = (currentBgIndex + 1) % backgrounds.length;
      bgImage.src = backgrounds[currentBgIndex];
      bgImage.style.opacity = '1';
    }, 800);
  }, 9000);
</script>
</html>
