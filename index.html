<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RENAISSANCE</title>
  <link rel="icon" type="image/png" href="assets/favicon/favicon-homepage.png">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="navbar/navbar-loader.js"></script>
  <style type="text/tailwindcss">
    @font-face {
        font-family: 'BBManualMono';
        src: url('assets/font/BBManualMonoPro-Regular.otf') format('opentype');
        font-weight: 400;
      }

      @layer base {
        body {
          font-family: 'BBManualMono', monospace;
        }
      }
    </style>
</head>
<body class="bg-black select-none">
  <img id="bg-image" src="assets/homepage/bg01.jpeg"
    class="fixed inset-0 w-screen h-screen object-cover pointer-events-none transition-opacity duration-800"/>
  <div class="fixed w-full h-screen flex items-center justify-between text-2xl px-25 mix-blend-difference pointer-events-none z-50">
    <span class="text-white">act i</span>
    <span class="text-white">RENAISSANCE</span>
  </div>
  <div class="fixed bottom-6 left-1/2 -translate-x-1/2 mix-blend-difference">
    <p class="text-white text-sm tracking-tight">© 2026 SENPPIE</p>
  </div>
</body>
<script>
  const backgrounds = [
    'assets/homepage/bg01.jpeg',
    'assets/homepage/bg02.jpeg',
    'assets/homepage/bg03.jpeg',
    'assets/homepage/bg04.jpeg',
    'assets/homepage/bg05.jpeg',
    'assets/homepage/bg06.jpeg',
    'assets/homepage/bg07.jpeg',
    'assets/homepage/bg08.jpeg',
    'assets/homepage/bg09.jpeg',
    'assets/homepage/bg10.jpeg',
    'assets/homepage/bg11.jpeg',
    'assets/homepage/bg12.jpeg',
    'assets/homepage/bg13.jpeg',
    'assets/homepage/bg14.jpeg',
    'assets/homepage/bg15.jpeg',
    'assets/homepage/bg16.jpeg',
    'assets/homepage/bg17.jpeg'
  ];

  let currentBgIndex = 0;
  const bgImage = document.getElementById('bg-image');

  setInterval(() => {
    bgImage.style.opacity = '0';

    setTimeout(() => {
      currentBgIndex = (currentBgIndex + 1) % backgrounds.length;
      bgImage.src = backgrounds[currentBgIndex];
      bgImage.style.opacity = '1';
    }, 800);
  }, 12000);
</script>
</html>
