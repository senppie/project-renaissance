<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHOP: RENAISSANCE</title>
  <link rel="icon" type="image/png" href="assets/favicon/favicon-store.png">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="assets/font/font.css">
  <script src="components/navbar/navbar-loader.js"></script>
  <script src="components/homebutton/homebutton-loader.js"></script>
  <script src="components/cart/cart-loader.js"></script>
  <style type="text/tailwindcss">
    @layer components {
      .shop-page {
        @apply min-h-screen text-white px-8 pt-28 pb-16;
      }

      .shop-grid {
        @apply grid grid-cols-4 gap-12 text-center w-full max-w-6xl mx-auto;
      }

      .shop-item {
        @apply flex flex-col items-center gap-4;
      }

      .shop-image {
        @apply w-40 h-40 object-contain border-2 border-white/10 rounded-xl;
      }

      .shop-title {
        @apply text-sm uppercase;
      }

      .shop-subtitle {
        @apply text-sm font-light uppercase text-white/60;
      }

      .shop-includes {
        @apply text-xs uppercase text-white/50 leading-snug;
      }

      .shop-price {
        @apply text-sm uppercase text-white;
      }

      .add-to-bag-btn {
        @apply mt-2 px-4 py-2 border border-white/20 rounded-full text-xs uppercase text-white hover:bg-white hover:text-blue-900 transition-colors;
      }
    }
  </style>
</head>
<body class="bg-black text-white select-none">
  <main class="shop-page">

      <span class="text-white uppercase">Renaissance</span>

    <section id="shopGrid" class="shop-grid"></section>

  <script>

    function renderShopGrid() {
      const shopGrid = document.getElementById('shopGrid');

      shopGrid.innerHTML = items.map((item) => `
        <article class="shop-item">
          <img src="${item.image}" alt="${item.title} ${item.subtitle}" class="shop-image" onerror="this.onerror=null; this.src='assets/shoppage/shop-vinyl-front.png'">
          <div class="flex flex-col items-center">
            <p class="shop-title">${item.title}</p>
            <p class="shop-subtitle">${item.subtitle}</p>
          </div>
          <p class="shop-includes">${item.includes}</p>
          <p class="shop-price">${item.price}</p>
          <button class="add-to-bag-btn" type="button">Add to Bag</button>
        </article>
      `).join('');
    }

    document.addEventListener('DOMContentLoaded', renderShopGrid);
  </script>
</body>
</html>
