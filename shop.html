<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHOP | PROJECT:RENAISSANCE</title>
  <link rel="icon" type="image/png" href="assets/favicon/favicon-shop.png">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="assets/font/font.css">
  <script src="components/title/title-loader.js"></script>
  <script src="components/navbar/navbar-loader.js"></script>
  <script src="components/homebutton/homebutton-loader.js"></script>
  <script src="components/cart/cart-loader.js"></script>
  <style type="text/tailwindcss">
    @layer components {
      .shop-page { @apply relative min-h-screen text-white pt-15 pb-1 z-10; }
      .shop-layer { @apply fixed top-0 left-0 right-0 h-16 bg-zinc-900/20 backdrop-blur-xl border-b-2 border-white/5 pointer-events-none z-20; }
      .shop-grid { @apply grid grid-cols-2 w-full border-l-2 border-t-2 border-white/5 rounded max-w-7xl mx-auto bg-zinc-900/20 backdrop-blur-md; }
      .shop-item { @apply flex flex-row items-center border-b-2 border-r-2 border-white/5 gap-5 relative; }
      .shop-media { @apply flex w-1/2 items-center justify-center overflow-hidden; }
      .shop-image { @apply h-64 w-full max-w-full border-r-2 border-white/5 object-contain; }
      .shop-details { @apply flex flex-col w-1/2 items-start justify-center; }
      .shop-title { @apply text-lg uppercase leading-tight; }
      .shop-description { @apply mt-4 text-sm text-white/30 uppercase leading-tight max-w-70; }
      .shop-actions { @apply mt-4 w-full flex items-center justify-between; }
      .shop-buy-button { @apply relative inline-grid overflow-hidden px-24 py-2 text-white bg-zinc-900/20 uppercase border-2 border-white/5 rounded hover:bg-white hover:text-black hover:font-medium transition cursor-pointer transition-transform duration-150; }
      .shop-buy-button-price { @apply col-start-1 row-start-1 transition duration-100 ease-out translate-y-0 opacity-100 group-hover:-translate-y-full group-hover:opacity-0; }
      .shop-buy-button-label { @apply col-start-1 row-start-1 transition duration-100 ease-out translate-y-full opacity-0 group-hover:translate-y-0 group-hover:opacity-100; }
      .shop-scroll { @apply h-165 scroll-smooth overflow-y-auto scrollbar-thumb-white/10; }

      @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.08); } 100% { transform: scale(1); } }
      .pop { animation: pop 260ms ease-in-out; }
    }
  </style>
</head>
<body class="bg-black text-white select-none">
  <main class="shop-page shop-scroll">
    <div class="shop-layer"></div>
    <section id="shopGrid" class="shop-grid"></section>
  </main>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    const items = [
      {
        id: 1,
        title: 'Renaissance Vinyl Collector\'s Edition',
        image: 'assets/shoppage/shop-vinyl.png',
        description: 'Includes 2 printed jackets + 2 printed inner sleeves, 36-page photo booklet, 1 of 3 randomized 24" X 36" collectible posters',
        price: '$44.98'
      },
      {
        id: 2,
        title: 'Renaissance CD',
        image: 'assets/shoppage/shop-cd.png',
        description: 'Includes 4 panel softpak, 28-page photo booklet, collectible mini poster',
        price: '$12.98'
      },
      {
        id: 3,
        title: 'Renaissance Digital Album',
        image: 'assets/shoppage/shop-digital-album.png',
        description: '.wav uncompressed lossless audio - Delivers via e-mail upon purchase',
        price: '$9.99'
      },
      {
        id: 4,
        title: 'Renaissance Vinyl Limited Edition',
        image: 'assets/shoppage/shop-vinyl-limited-edition.png',
        description: 'Alternate cover art - Includes gatefold jacket with printed inner sleeves, 2LP - 180g vinyl',
        price: '$32.98'
      },
      {
        id: 5,
        title: 'Break My Soul - Digital Single',
        image: 'assets/shoppage/shop-bms-ds.png',
        description: 'Includes the Single, Instrumental, and A Cappella tracks - .wav uncompressed lossless audio',
        price: '$3.87'
      },
      {
        id: 6,
        title: 'Break My Soul (Remixes)',
        image: 'assets/shoppage/shop-bms-remixes.png',
        description: 'Includes remixes by Will.i.am, Terry Hunter, Honey Dijon & Nita Aviance - .wav uncompressed lossless audio',
        price: '$5.16'
      },
      {
        id: 7,
        title: 'Break My Soul (The Queens Remix)',
        image: 'assets/shoppage/shop-bms-queens.png',
        description: '.wav uncompressed lossless audio - Delivers via e-mail upon purchase',
        price: '$1.29'
      },
      {
        id: 8,
        title: 'Cuff It - Digital Single',
        image: 'assets/shoppage/shop-ci-ds.png',
        description: 'Includes the Wetter remix + Acapella & Instrumental - .wav uncompressed lossless audio',
        price: '$3.87'
      },
      {
        id: 9,
        title: 'America Has a Problem - Digital Single',
        image: 'assets/shoppage/shop-ahap.png',
        description: '.wav uncompressed lossless audio - Delivers via e-mail upon purchase',
        price: '$1.29'
      },
      {
        id: 10,
        title: 'My House - Digital Single',
        image: 'assets/shoppage/shop-myhouse.png',
        description: '.wav uncompressed lossless audio - Delivers via e-mail upon purchase',
        price: '$3.87'
      }
    ];

    function renderShopGrid() {
      const shopGrid = document.getElementById('shopGrid');
      const visibleItems = items.filter((item) => !item.title.startsWith('Title-'));

      shopGrid.innerHTML = visibleItems.map((item) => {
        return `
        <article class="shop-item">
          <div class="shop-media">
            <img src="${item.image}" class="shop-image">
          </div>
          <div class="shop-details">
            <p class="shop-title">${item.title}</p>
            <p class="shop-description">${item.description}</p>
            <div class="shop-actions">
              <button data-item-id="${item.id}" class="group add-to-bag shop-buy-button">
                <span class="shop-buy-button-price">${item.price}</span>
                <span class="shop-buy-button-label">Add to Bag</span>
              </button>
            </div>
          </div>
        </article>
      `;
      }).join('');
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderShopGrid();
      updateCartBadge();
    });

    // If the cart component is dynamically loaded later, update badge when it's ready
    document.addEventListener('cart:loaded', updateCartBadge);
    // react to cart changes (add/remove/clear) from other pages
    document.addEventListener('cart:changed', updateCartBadge);


    // Cart helpers (localStorage-backed, demo-only)
    function getCart() {
      try {
        return JSON.parse(localStorage.getItem('renaissance_cart') || '[]');
      } catch (e) {
        return [];
      }
    }

    function saveCart(cart) {
      localStorage.setItem('renaissance_cart', JSON.stringify(cart));
    }

    function addToCart(itemId) {
      const cart = getCart();
      const existing = cart.find((i) => Number(i.id) === Number(itemId));
      if (existing) {
        existing.qty = (existing.qty || 1) + 1;
      } else {
        const item = items.find((it) => Number(it.id) === Number(itemId));
        cart.push({ id: itemId, title: item ? item.title : '', price: item ? item.price : '', qty: 1 });
      }
      saveCart(cart);
      updateCartBadge();
      // Notify cart UI to re-render
      document.dispatchEvent(new CustomEvent('cart:changed'));
    }

    function updateCartBadge() {
      const badge = document.getElementById('cartBadge');
      if (!badge) return;
      const cart = getCart();
      const total = cart.reduce((s, i) => s + (i.qty || 0), 0);
      badge.textContent = String(total);
      // show badge only if there's at least one item
      if (total > 0) {
        badge.classList.remove('hidden');
        badge.setAttribute('aria-hidden', 'false');
        // ensure visible style if CSS toggles differ
        badge.style.display = '';
      } else {
        badge.classList.add('hidden');
        badge.setAttribute('aria-hidden', 'true');
        badge.style.display = 'none';
      }
    }

    document.addEventListener('click', (event) => {
      const addBtn = event.target.closest('.add-to-bag');
      if (!addBtn) return;
      const id = Number(addBtn.getAttribute('data-item-id'));
      if (!id && id !== 0) return;

      // small pop animation to give click feedback
      addBtn.classList.add('pop');
      setTimeout(() => addBtn.classList.remove('pop'), 300);

      addToCart(id);
    });

  </script>
</body>
</html>
