<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHOP: RENAISSANCE</title>
  <link rel="icon" type="image/png" href="assets/favicon/favicon-store.png">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="assets/font/font.css">
  <script src="components/navbar/navbar-loader.js"></script>
  <script src="components/homebutton/homebutton-loader.js"></script>
  <script src="components/cart/cart-loader.js"></script>
  <style type="text/tailwindcss">
    @layer components {
      .shop-page {
        @apply min-h-screen text-white px-5 pt-30 pb-16;
      }

      .shop-grid {
        @apply grid grid-cols-4 gap-10 w-full max-w-7xl mx-auto;
      }

      .shop-item {
        @apply flex flex-col overflow-hidden rounded-2xl border-2 border-white/5 backdrop-blur-md bg-zinc-900/20 z-50;
      }

      .shop-media {
        @apply flex h-44 shrink-0 items-center justify-center px-4 pt-4 pb-5;
      }

      .shop-image {
        @apply h-50 w-full max-w-full object-contain;
      }

      .shop-details {
        @apply flex flex-1 flex-col px-4 pt-0 pb-4;
      }

      .shop-heading-row {
        @apply flex items-start;
      }

      .shop-copy {
        @apply min-w-0 flex-1;
      }

      .shop-title {
        @apply text-lg uppercase leading-tight border-b-2 border-white/5 pb-3;
      }

      .shop-description {
        @apply mt-4 min-h-24 text-sm font-light border-white/5 pb-4 text-white/60 uppercase leading-tight;
      }

      .shop-actions {
        @apply mt-auto flex flex-col items-center justify-center gap-2;
      }

      .version-toggle {
        @apply inline-flex w-50 overflow-hidden rounded-4xl border-2 border-white/5 text-sm text-white mb-2;
      }

      .version-option {
        @apply flex-1 py-1 text-white/60 transition uppercase hover:bg-zinc-700/40 leading-tight hover:text-white cursor-pointer;
      }

      .version-option.active {
        @apply bg-zinc-700/40 text-white;
      }

    }
  </style>
  <style>
    /* small pop animation for Add to Bag button */
    @keyframes pop {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }
    .pop { animation: pop 260ms ease-in-out; }
  </style>
</head>
<body class="bg-black text-white select-none">
  <main class="shop-page">
    <div class="fixed flex justify-between top-9 left-0 right-0 px-25 text-xl pointer-events-none z-99">
      <span class="font-light text-white">act i</span>
      <span class="text-white uppercase">Renaissance</span>
    </div>
    <section id="shopGrid" class="shop-grid"></section>
    <!-- <div>
      <img src="assets/shoppage/gradientblurbg.png"
      class="fixed bg-cover bottom-10 animate-pulse [animation-duration:20s]"/>
    </div> -->
  </main>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    const items = [
      {
        id: 1,
        title: 'Renaissance Vinyl Collector\'s Edition',
        image: 'assets/shoppage/shop-vinyl.png',
        description: 'Includes 2 printed jackets + 2 printed inner sleeves, 36-page photo booklet, 1 of 3 randomized 24" X 36" collectible posters',
        price: '$44.98'
      },
      {
        id: 2,
        title: 'Renaissance CDㅤㅤㅤㅤㅤㅤㅤㅤ',
        image: 'assets/shoppage/shop-cd.png',
        description: 'Includes 4 panel softpak, 28-page photo booklet, collectible mini poster',
        price: '$12.98'
      },
      {
        id: 3,
        title: 'Renaissance Digital Album',
        image: 'assets/shoppage/shop-digital-album.png',
        description: '.wav uncompressed lossless audio - Delivers via e-mail upon purchase',
        price: '$9.99'
      },
      {
        id: 4,
        title: 'Renaissance Vinyl Limited Edition',
        image: 'assets/shoppage/shop-vinyl-limited-edition.png',
        description: 'Alternate cover art - Includes gatefold jacket with printed inner sleeves, 2LP - 180g vinyl',
        price: '$32.98'
      },
      {
        id: 5,
        title: 'Break My Soul - Digital Single',
        image: 'assets/shoppage/shop-bms-ds.png',
        description: 'Includes the Single, Instrumental, and A Cappella versions - .wav uncompressed lossless audio',
        price: '$3.87'
      },
       {
        id: 6,
        title: 'Break My Soul (Remixes)ㅤㅤㅤㅤㅤㅤㅤㅤ',
        image: 'assets/shoppage/shop-bms-remixes.png',
        description: 'Includes remixes by Will.i.am, Terry Hunter, Honey Dijon & Nita Aviance - .wav uncompressed lossless audio',
        price: '$5.16'
      },
      {
        id: 7,
        title: 'Break My Soul (The Queens Remix)',
        image: 'assets/shoppage/shop-bms-queens.png',
        description: '.wav uncompressed lossless audio - Delivers via e-mail upon purchase',
        price: '$1.29'
      },
      {
        id: 8,
        title: 'Cuff It - Digital Single',
        image: 'assets/shoppage/shop-ci-ds.png',
        description: 'Includes the Wetter remix + Acapella & Instrumental - .wav uncompressed lossless audio',
        price: '$3.87'
      },
      {
        id: 9,
        title: 'America Has a Problem - Digital Single',
        image: 'assets/shoppage/shop-ahap.png',
        description: '.wav uncompressed lossless audio - Delivers via e-mail upon purchase',
        price: '$1.29'
      },
      {
        id: 10,
        title: 'My House - Digital Single',
        image: 'assets/shoppage/shop-myhouse.png',
        description: '.wav uncompressed lossless audio - Delivers via e-mail upon purchase',
        price: '$3.87'
      }
    ];

    function renderShopGrid() {
      const shopGrid = document.getElementById('shopGrid');
      const visibleItems = items.filter((item) => !item.title.startsWith('Title-'));

      shopGrid.innerHTML = visibleItems.map((item) => {
        return `
        <article class="shop-item">
          <div class="shop-media">
            <img src="${item.image}" alt="${item.title}" class="shop-image" onerror="this.onerror=null; this.src='assets/shoppage/shop-vinyl.png'">
          </div>
          <div class="shop-details">
            <div class="shop-heading-row">
              <div class="shop-copy">
                <p class="shop-title">${item.title}</p>
              </div>
            </div>
            <p class="shop-description">${item.description}</p>
            <div class="shop-actions">
              <div class="version-toggle" role="group" aria-label="Audio version">
                <button type="button" class="version-option" aria-pressed="true">Clean</button>
                <button type="button" class="version-option active" aria-pressed="false">Explicit</button>
              </div>
              <button data-item-id="${item.id}" class="add-to-bag group relative inline-grid place-items-center overflow-hidden rounded-4xl bg-transparent border-2 border-white/5 hover:bg-zinc-700/40 px-4 py-3 text-center text-white font-medium uppercase leading-none transition cursor-pointer transition-transform duration-150 active:scale-95" aria-label="Add ${item.title} to bag">
                <span class="col-start-1 row-start-1 transition duration-300 ease-out translate-y-0 opacity-100 group-hover:-translate-y-full group-hover:opacity-0">${item.price}</span>
                <span class="col-start-1 row-start-1 transition duration-300 ease-out translate-y-full opacity-0 group-hover:translate-y-0 group-hover:opacity-100">Add to Bag</span>
              </button>
            </div>
          </div>
        </article>
      `;
      }).join('');
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderShopGrid();
      updateCartBadge();
    });

    // If the cart component is dynamically loaded later, update badge when it's ready
    document.addEventListener('cart:loaded', updateCartBadge);

    // Cart helpers (localStorage-backed, demo-only)
    function getCart() {
      try {
        return JSON.parse(localStorage.getItem('renaissance_cart') || '[]');
      } catch (e) {
        return [];
      }
    }

    function saveCart(cart) {
      localStorage.setItem('renaissance_cart', JSON.stringify(cart));
    }

    function addToCart(itemId, version) {
      const cart = getCart();
      // treat same item+version as the same cart line
      const existing = cart.find((i) => Number(i.id) === Number(itemId) && (i.version || 'Explicit') === (version || 'Explicit'));
      if (existing) {
        existing.qty = (existing.qty || 1) + 1;
      } else {
        const item = items.find((it) => Number(it.id) === Number(itemId));
        cart.push({ id: itemId, title: item ? item.title : '', price: item ? item.price : '', qty: 1, version: version || 'Explicit' });
      }
      saveCart(cart);
      updateCartBadge();
      // Notify cart UI to re-render
      document.dispatchEvent(new CustomEvent('cart:changed'));
    }

    function updateCartBadge() {
      const badge = document.getElementById('cartBadge');
      if (!badge) return;
      const cart = getCart();
      const total = cart.reduce((s, i) => s + (i.qty || 0), 0);
      badge.textContent = String(total);
      // show badge only if there's at least one item
      if (total > 0) {
        badge.classList.remove('hidden');
        badge.setAttribute('aria-hidden', 'false');
        // ensure visible style if CSS toggles differ
        badge.style.display = '';
      } else {
        badge.classList.add('hidden');
        badge.setAttribute('aria-hidden', 'true');
        badge.style.display = 'none';
      }
    }

    document.addEventListener('click', (event) => {
      const addBtn = event.target.closest('.add-to-bag');
      if (!addBtn) return;
      const id = Number(addBtn.getAttribute('data-item-id'));
      if (!id && id !== 0) return;

      // determine selected version inside the same shop-item
      const shopItem = addBtn.closest('.shop-item');
      let version = 'Explicit';
      if (shopItem) {
        const selected = shopItem.querySelector('.version-option.active');
        if (selected) version = selected.textContent.trim();
      }

      // small pop animation to give click feedback
      addBtn.classList.add('pop');
      setTimeout(() => addBtn.classList.remove('pop'), 300);

      addToCart(id, version);
    });

    document.addEventListener('click', (event) => {
      const selectedOption = event.target.closest('.version-option');

      if (!selectedOption) return;

      const toggle = selectedOption.closest('.version-toggle');
      const options = toggle.querySelectorAll('.version-option');

      options.forEach((option) => {
        const isActive = option === selectedOption;
        option.classList.toggle('active', isActive);
        option.setAttribute('aria-pressed', String(isActive));
      });
    });
  </script>
</body>
</html>
