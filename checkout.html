<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CHECKOUT: RENAISSANCE</title>
  <link rel="icon" type="image/png" href="assets/favicon/favicon-homepage.png">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="assets/font/font.css">
  <script src="components/titlehero/titlehero-loader.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style type="text/tailwindcss">
   @layer components {
     .card { @apply max-w-md mx-auto bg-zinc-900/20 rounded p-6 border-2 border-white/5 bg-zinc-900/20; }
     .card-order { @apply max-w-md mx-auto p-6; }
     .input { @apply w-full bg-transparent border-2 border-white/5 rounded px-4 py-3 text-white focus:outline-none; }
     .input-group { @apply relative; }
     .input-group label { @apply absolute left-4 top-4 text-white/30 text-sm uppercase pointer-events-none transition-all duration-200; }
     .input-group input:focus ~ label,
     .input-group input:not(:placeholder-shown) ~ label { @apply -top-2 text-xs font-medium bg-black text-white/60 px-1; }
     .btn { @apply w-full rounded py-3 mt-4 inline-flex items-center justify-center gap-2; }
     .link { @apply text-sm text-white/60 hover:text-white cursor-pointer; }
     .pop { transform: scale(0.98); transition: transform 160ms ease; }
     .payment-scroll { @apply h-192 scroll-smooth overflow-y-auto scrollbar-thumb-white/10; }
     .step-panel { transition: opacity 240ms ease; }
     .card-details-shell { @apply bg-red-900 rounded max-h-0 opacity-0 overflow-hidden pointer-events-none transition-all duration-200; }
     .card-details-shell.is-visible { @apply max-h-72 opacity-100 pointer-events-auto transition-all duration-200; }

   }
  </style>
</head>
<body class="bg-black text-white select-none">
  <main class="min-h-screen flex items-center justify-center">
      <div class="grid grid-cols-2 w-full max-w-4xl">
        <!-- Billing & Payment card -->
        <section class="card payment-scroll">
            <div class="mb-6">
              <div class="flex items-center justify-between text-md uppercase">
                <div id="shippingStepLabel" class="cursor-pointer hover:text-white transition-colors text-white">Shipping Information</div>
                <div id="paymentStepLabel" class="text-white/30">Payment</div>
              </div>
            <div class="mt-2 flex items-center gap-2">
              <div id="shippingProgress" class="h-1 flex-1 bg-white"></div>
              <div id="paymentProgress" class="h-1 flex-1 bg-white/10"></div>
            </div>
          </div>
          <form id="paymentForm" class="space-y-4">
            <div id="shippingStep" class="step-panel">
            <div class="mb-4 flex items-center gap-3">
              <div class="text-white/60 uppercase">Contact</div>
              <div class="flex-grow border-b-2 border-white/5"></div>
            </div>
            <div class="space-y-4">
            <div class="input-group">
              <input id="billingEmail" class="input" type="email" placeholder=" "  />
              <label for="billingEmail">Email</label>
            </div>
            <div class="input-group">
              <input id="billingPhone" class="input" type="tel" placeholder=" "  />
              <label for="billingPhone">Phone Number</label>
            </div>
            </div>
            <div class="mt-6 mb-4 flex items-center gap-3">
              <div class="text-white/60 uppercase">Billing</div>
              <div class="flex-grow border-b-2 border-white/5"></div>
            </div>
            <div class="space-y-4">
            <div class="grid grid-cols-2 gap-3">
            <div class="input-group">
              <input id="billingFirstName" class="input" type="text" placeholder=" " />
              <label for="billingFirstName">First Name</label>
            </div>
            <div class="input-group">
              <input id="billingLastName" class="input" type="text" placeholder=" " />
              <label for="billingLastName">Last Name</label>
            </div>
            </div>
            <div class="input-group">
              <input id="billingStreet" class="input" type="text" placeholder=" "  />
              <label for="billingStreet">Address</label>
            </div>
            <div class="input-group">
                <input id="billingCity" class="input" type="text" placeholder=" "  />
                <label for="billingCity">City</label>
              </div>
            <div class="grid grid-cols-2 gap-3">
              <div class="input-group">
                <input id="billingPostal" class="input" type="text" placeholder=" "  />
                <label for="billingPostal">Postal code</label>
              </div>
              <div class="input-group">
                <input id="billingCountry" class="input" type="text" placeholder=" " />
                <label for="billingCountry">Country/Region</label>
              </div>
            </div>
            </div>
            <div class="mt-6">
                <div class="flex-grow border-b-2 border-white/5"></div>
              <button id="continueToPayment" type="button" class="btn cursor-pointer mt-6 border-2 border-white/5 text-white hover:bg-white hover:text-black hover:font-bold uppercase">Continue to Payment</button>
            </div>
            </div>
            <div id="paymentStep" class="step-panel hidden opacity-0 mt-2">
            <div class="mt-2">
              <div class="flex items-center gap-3">
                <div class="text-white/60 text-md uppercase mb-4">Payment Method</div>
                <div class="flex-grow border-b-2 border-white/5 mb-4"></div>
              </div>
              <div id="pmButtons" class="flex flex-col gap-2 w-full">
                <div class="space-y-2">
                  <button type="button" data-pm="card"
                    class="pm-option cursor-pointer inline-flex w-full h-12 items-center justify-center gap-2 py-2 text-sm uppercase rounded border-2 border-white/5 bg-white/5 text-white">
                    <i data-lucide="credit-card" class="w-5 h-5"></i>
                    <span>Credit/Debit</span>
                  </button>
                  <div class="card-details-shell overflow-hidden">
                    <div id="cardDetails" class="space-y-4 pt-2">
                      <div class="input-group">
                        <input id="cardNumber" class="input uppercase" type="text" placeholder=" " />
                        <label for="cardNumber">Card number</label>
                      </div>
                      <div class="grid grid-cols-2 gap-3">
                        <div class="input-group">
                          <input id="cardExpiry" class="input uppercase" type="text" placeholder=" " />
                          <label for="cardExpiry">Expiry</label>
                        </div>
                        <div class="input-group">
                          <input id="cardCvc" class="input uppercase" type="text" placeholder=" " />
                          <label for="cardCvc">CVC</label>
                        </div>
                      </div>
                      <div class="input-group mb-2">
                        <input id="cardName" class="input uppercase" type="text" placeholder=" " />
                        <label for="cardName">Name on card</label>
                      </div>
                    </div>
                  </div>
                </div>
                <button type="button" data-pm="applepay" class="pm-option cursor-pointer inline-flex w-full h-12 shrink-0 items-center justify-center gap-2 px-3 py-2 text-sm uppercase rounded border-2 border-white/5 bg-white/5 text-white">
                  <svg viewBox="0 0 550 250" class="w-10 h-6" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg"><path fill="currentColor" d="M93.6,27.1C87.6,34.2,78,39.8,68.4,39c-1.2-9.6,3.5-19.8,9-26.1c6-7.3,16.5-12.5,25-12.9  C103.4,10,99.5,19.8,93.6,27.1 M102.3,40.9c-13.9-0.8-25.8,7.9-32.4,7.9c-6.7,0-16.8-7.5-27.8-7.3c-14.3,0.2-27.6,8.3-34.9,21.2  c-15,25.8-3.9,64,10.6,85c7.1,10.4,15.6,21.8,26.8,21.4c10.6-0.4,14.8-6.9,27.6-6.9c12.9,0,16.6,6.9,27.8,6.7  c11.6-0.2,18.9-10.4,26-20.8c8.1-11.8,11.4-23.3,11.6-23.9c-0.2-0.2-22.4-8.7-22.6-34.3c-0.2-21.4,17.5-31.6,18.3-32.2  C123.3,42.9,107.7,41.3,102.3,40.9 M182.6,11.9v155.9h24.2v-53.3h33.5c30.6,0,52.1-21,52.1-51.4c0-30.4-21.1-51.2-51.3-51.2H182.6z   M206.8,32.3h27.9c21,0,33,11.2,33,30.9c0,19.7-12,31-33.1,31h-27.8V32.3z M336.6,169c15.2,0,29.3-7.7,35.7-19.9h0.5v18.7h22.4V90.2  c0-22.5-18-37-45.7-37c-25.7,0-44.7,14.7-45.4,34.9h21.8c1.8-9.6,10.7-15.9,22.9-15.9c14.8,0,23.1,6.9,23.1,19.6v8.6l-30.2,1.8  c-28.1,1.7-43.3,13.2-43.3,33.2C298.4,155.6,314.1,169,336.6,169z M343.1,150.5c-12.9,0-21.1-6.2-21.1-15.7c0-9.8,7.9-15.5,23-16.4  l26.9-1.7v8.8C371.9,140.1,359.5,150.5,343.1,150.5z M425.1,210.2c23.6,0,34.7-9,44.4-36.3L512,54.7h-24.6l-28.5,92.1h-0.5  l-28.5-92.1h-25.3l41,113.5l-2.2,6.9c-3.7,11.7-9.7,16.2, -20.4,16.2c-1.9,0-5.6-0.2-7.1-0.4v18.7C417.3,210,423.3,210.2,425.1,210.2z"/></svg>
                </button>
                <button type="button" data-pm="gpay" class="pm-option cursor-pointer inline-flex w-full h-12 shrink-0 items-center justify-center gap-2 px-3 py-2 text-sm uppercase rounded border-2 border-white/5 bg-white/5 text-white">
                  <svg viewBox="0 0 88 40" class="w-10 h-6" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
                    <path fill="currentColor" d="M37.8,19.7V29h-3V6h7.8c1.9,0,3.7,0.7,5.1,2c1.4,1.2,2.1,3,2.1,4.9c0,1.9-0.7,3.6-2.1,4.9c-1.4,1.3-3.1,2-5.1,2  L37.8,19.7L37.8,19.7z M37.8,8.8v8h5c1.1,0,2.2-0.4,2.9-1.2c1.6-1.5,1.6-4,0.1-5.5c0,0-0.1-0.1-0.1-0.1c-0.8-0.8-1.8-1.3-2.9-1.2  L37.8,8.8L37.8,8.8z"/>
                    <path fill="currentColor" d="M56.7,12.8c2.2,0,3.9,0.6,5.2,1.8s1.9,2.8,1.9,4.8V29H61v-2.2h-0.1c-1.2,1.8-2.9,2.7-4.9,2.7  c-1.7,0-3.2-0.5-4.4-1.5c-1.1-1-1.8-2.4-1.8-3.9c0-1.6,0.6-2.9,1.8-3.9c1.2-1,2.9-1.4,4.9-1.4c1.8,0,3.2,0.3,4.3,1v-0.7  c0-1-0.4-2-1.2-2.6c-0.8-0.7-1.8-1.1-2.9-1.1c-1.7,0-3,0.7-3.9,2.1l-2.6-1.6C51.8,13.8,53.9,12.8,56.7,12.8z M52.9,24.2  c0,0.8,0.4,1.5,1,1.9c0.7,0.5,1.5,0.8,2.3,0.8c1.2,0,2.4-0.5,3.3-1.4c1-0.9,1.5-2,1.5-3.2c-0.9-0.7-2.2-1.1-3.9-1.1  c-1.2,0-2.2,0.3-3,0.9C53.3,22.6,52.9,23.3,52.9,24.2z"/>
                    <path fill="currentColor" d="M80,13.3l-9.9,22.7h-3l3.7-7.9l-6.5-14.7h3.2l4.7,11.3h0.1l4.6-11.3H80z"/>
                    <path fill="currentColor" d="M25.9,17.7c0-0.9-0.1-1.8-0.2-2.7H13.2v5.1h7.1c-0.3,1.6-1.2,3.1-2.6,4v3.3H22C24.5,25.1,25.9,21.7,25.9,17.7z"/>
                    <path fill="currentColor" d="M13.2,30.6c3.6,0,6.6-1.2,8.8-3.2l-4.3-3.3c-1.2,0.8-2.7,1.3-4.5,1.3c-3.4,0-6.4-2.3-7.4-5.5H1.4v3.4  C3.7,27.8,8.2,30.6,13.2,30.6z"/>
                    <path fill="currentColor" d="M5.8,19.9c-0.6-1.6-0.6-3.4,0-5.1v-3.4H1.4c-1.9,3.7-1.9,8.1,0,11.9L5.8,19.9z"/>
                    <path fill="currentColor" d="M13.2,9.4c1.9,0,3.7,0.7,5.1,2l0,0l3.8-3.8c-2.4-2.2-5.6-3.5-8.8-3.4c-5,0-9.6,2.8-11.8,7.3l4.4,3.4  C6.8,11.7,9.8,9.4,13.2,9.4z"/>
                  </svg>
                </button>
              </div>
            <input type="hidden" name="pm" id="pmValue" value="card" />
            <div class="mt-6 border-t-2 border-white/5 pt-4">
              <label class="flex items-center justify-center gap-3 text-sm">
                <input id="agree" type="checkbox" class="w-4 h-4 cursor-pointer accent-white" />
                <span class="text-white uppercase">I agree with <a href="#" class="link">the terms and conditions</a></span>
              </label>
              <button id="purchaseBtn" type="button" class="btn hidden cursor-pointer rounded bg-transparent border-2 border-white/5 text-white hover:bg-white hover:text-black hover:font-bold uppercase">Finalize Purchase</button>
            </div>
            </div>
          </form>
        </section>
        <!-- Order summary card -->
        <section class="card-order w-full max-w-none mx-0 min-h-192 h-full flex flex-col">
            <div class="flex flex-col items-start">
              <h3 class="text-md uppercase">Detail product</h3>
            </div>
            <div class="space-y-2">
              <div>
                <ul id="cartItems" class="mt-3 space-y-2 pr-2">
                  <!-- items populated by JS -->
                </ul>
              </div>
              <div class="flex items-center justify-between pt-4">
                <div class="text-white uppercase">Subtotal:</div>
                <div id="subtotal" class="text-white"></div>
              </div>
              <div class="border-t-2 border-white/5 pt-2 flex items-center justify-between">
                <div class="text-white uppercase">Shipping:</div>
                <div id="shipping" class="text-white uppercase">Free</div>
              </div>
              <div class="border-t-2 border-white/5 pt-3 flex items-center justify-between text-md uppercase">
                <div>Total</div>
                <div id="totalPrice" class="text-white"></div>
              </div>
            </div>

        </section>
      </div>
  </main>

  <script>
    if (window.lucide) lucide.createIcons();

    // populate cart items from shop (localStorage key: 'renaissance_cart')
    function formatMoney(n) { return '$' + n.toFixed(2); }

    function renderCartItems() {
      const container = document.getElementById('cartItems');
      const subtotalEl = document.getElementById('subtotal');
      const totalEl = document.getElementById('totalPrice');
      container.innerHTML = '';
      let cart = [];
      try { const stored = JSON.parse(localStorage.getItem('renaissance_cart') || '[]'); if (Array.isArray(stored)) cart = stored; } catch (e) { }

      if (!cart.length) {
        const li = document.createElement('li');
        li.className = 'text-white/60 text-sm uppercase';
        li.textContent = 'Your bag is empty';
        container.appendChild(li);
        subtotalEl.textContent = formatMoney(0);
        totalEl.textContent = formatMoney(0);
        return;
      }

      let subtotal = 0;
      cart.forEach((item, index) => {
        const qty = Number(item.qty || 1);
        const priceNum = parseFloat(String(item.price || '').replace(/[^0-9.\-]+/g, '')) || 0;
        const lineTotal = priceNum * qty;

        const li = document.createElement('li');
        li.className = 'flex items-center justify-between';
        if (index < cart.length - 1) {
          li.classList.add('border-b-2', 'border-white/5', 'pb-2', 'mb-2');
        }

        const left = document.createElement('div');
        left.className = 'flex flex-col';
        const nameSpan = document.createElement('span');
        nameSpan.className = 'text-white/60 text-md uppercase';
        nameSpan.textContent = item.title || item.name || 'Item';
        left.appendChild(nameSpan);

        const itemMeta = document.createElement('span');
        itemMeta.className = 'text-xs text-white/30 uppercase';
        itemMeta.textContent = `${formatMoney(lineTotal)} ― QTY: ${qty}`;
        left.appendChild(itemMeta);

        li.appendChild(left);
        container.appendChild(li);
        subtotal += lineTotal;
      });

      subtotalEl.textContent = formatMoney(subtotal);
      totalEl.textContent = formatMoney(subtotal);
    }

    renderCartItems();

    // payment form handling (button-based)
    const pmButtons = Array.from(document.querySelectorAll('.pm-option'));
    const pmValue = document.getElementById('pmValue');
    const cardShell = document.querySelector('.card-details-shell');
    const cardDetails = document.getElementById('cardDetails');
    function setPm(v) {
      pmValue.value = v;
      pmButtons.forEach(b => {
        if (b.dataset.pm === v) {
          b.classList.remove('bg-white/5'); b.classList.add('bg-white'); b.classList.remove('text-white'); b.classList.add('text-black');
          b.setAttribute('aria-pressed', 'true');
        } else {
          b.classList.add('bg-white/5'); b.classList.remove('bg-white'); b.classList.remove('text-black'); b.classList.add('text-white');
          b.setAttribute('aria-pressed', 'false');
        }
      });

      const showingCardDetails = v === 'card';
      cardShell.classList.toggle('is-visible', showingCardDetails);
      cardDetails.style.pointerEvents = showingCardDetails ? 'auto' : 'none';
      cardDetails.style.visibility = showingCardDetails ? 'visible' : 'hidden';
      cardDetails.style.opacity = showingCardDetails ? '1' : '0';
    }
    pmButtons.forEach(b => b.addEventListener('click', (e) => { setPm(b.dataset.pm); }));
    setPm('');

    const shippingStep = document.getElementById('shippingStep');
    const paymentStep = document.getElementById('paymentStep');
    const continueToPayment = document.getElementById('continueToPayment');
    const backToShipping = document.getElementById('backToShipping');
    const purchaseBtn = document.getElementById('purchaseBtn');
    const shippingStepLabel = document.getElementById('shippingStepLabel');
    const paymentStepLabel = document.getElementById('paymentStepLabel');
    const shippingProgress = document.getElementById('shippingProgress');
    const paymentProgress = document.getElementById('paymentProgress');

    function switchStep(from, to) {
      from.classList.add('opacity-0');
      setTimeout(() => {
        from.classList.add('hidden');
        to.classList.remove('hidden');
        requestAnimationFrame(() => to.classList.remove('opacity-0'));
      }, 240);
    }

    function setProgressStep(step) {
      const isPayment = step === 'payment';
      shippingStepLabel.classList.toggle('text-white', !isPayment);
      shippingStepLabel.classList.toggle('text-white/60', isPayment);
      paymentStepLabel.classList.toggle('text-white', isPayment);
      paymentStepLabel.classList.toggle('text-white/30', !isPayment);
      shippingProgress.classList.toggle('bg-white', !isPayment);
      shippingProgress.classList.toggle('bg-white/30', isPayment);
      paymentProgress.classList.toggle('bg-white', isPayment);
      paymentProgress.classList.toggle('bg-white/10', !isPayment);
    }

    continueToPayment.addEventListener('click', () => {
      if (!shippingStep.querySelector(':invalid')) {
        switchStep(shippingStep, paymentStep);
        setProgressStep('payment');
        purchaseBtn.classList.remove('hidden');
        paymentStep.scrollIntoView({ behavior: 'smooth', block: 'start' });
      } else {
        shippingStep.querySelector(':invalid').reportValidity();
      }
    });

    shippingStepLabel.addEventListener('click', () => {
      switchStep(paymentStep, shippingStep);
      setProgressStep('shipping');
      purchaseBtn.classList.add('hidden');
      shippingStep.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });

    purchaseBtn.addEventListener('click', () => {
      const agree = document.getElementById('agree');
      if (!agree.checked) {
        alert('Please accept the privacy and service agreement.');
        return;
      }
      // simple validation
      const firstName = document.getElementById('billingFirstName').value.trim();
      const lastName = document.getElementById('billingLastName').value.trim();
      const name = `${firstName} ${lastName}`.trim();
      if (!name) { alert('Please enter your full name'); return; }

      // fake purchase flow
      try { localStorage.setItem('last_purchase', JSON.stringify({ name, time: Date.now() })); } catch (e) { }

      // clear bag for both pages and notify listeners
      try { localStorage.removeItem('renaissance_cart'); } catch (e) { }
      document.dispatchEvent(new CustomEvent('cart:changed'));
      // update UI immediately on checkout page
      renderCartItems();

      alert('Purchase complete: You will receive an email confirmation shortly. Thank you! (this is a demo, no real purchase was made.)');
      // redirect back to shop
      window.location.href = 'shop.html';
    });
  </script>
</body>
</html>
