<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VISUALS | PROJECT:RENAISSANCE</title>
  <link rel="icon" type="image/png" href="assets/favicon/visuals.png">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="assets/font/font.css">
  <script src="components/title/title-loader.js"></script>
  <script src="components/navbar/navbar-loader.js"></script>
  <script src="components/homebutton/homebutton-loader.js"></script>
  <script src="components/cart/cart-loader.js"></script>
  <style type="text/tailwindcss">
    @layer components {
      .visuals-strip { @apply relative z-10 flex h-screen w-full flex-row; }
      .visuals-photo { @apply block h-screen w-auto max-w-none shrink-0 object-cover; }
      .scroll { @apply overflow-x-scroll overflow-y-hidden }
      .navhint { @apply fixed inline-flex left-1/2 bottom-6 -translate-x-1/2 rounded border-2 border-white/5 bg-zinc-900/20 px-3 py-2 text-sm uppercase tracking-tight text-white backdrop-blur-md transition-all duration-300 z-40 }
      .navhint-hidden { @apply opacity-0 pointer-events-none; }
    }
  </style>
</head>
<body class="bg-black scroll select-none">
  <div id="navhint" class="fixed navhint">Scroll or use the arrow keys to navigate</div>
  <main id="visualsStrip" class="visuals-strip"></main>
  <script>
    const visuals = [
      'assets/musicpage/album-cover.jpeg',
      'assets/visualspage/cozy.jpg',
      'assets/visualspage/01.jpg',
      'assets/visualspage/summerrenaissance.jpg',
      'assets/visualspage/02.jpg',
      'assets/visualspage/03.jpg',
      'assets/visualspage/04.jpg',
      'assets/visualspage/heated.jpg',
      'assets/visualspage/energy-1.jpg',
      'assets/visualspage/energy-2.jpeg',
      'assets/visualspage/energy-3.jpg',
      'assets/visualspage/05.jpg',
      'assets/visualspage/breakmysoul.jpg',
      'assets/visualspage/06.jpg',
      'assets/visualspage/07.jpg',
      'assets/visualspage/08.jpg',
      'assets/visualspage/imthatgirl.jpg',
      'assets/visualspage/09.jpg',
      'assets/visualspage/churchgirl.jpg',
      'assets/visualspage/plasticoofthesofa-1.jpg',
      'assets/visualspage/plasticoofthesofa-2.jpg',
      'assets/visualspage/plasticoofthesofa-3.jpg',
      'assets/visualspage/plasticoofthesofa-4.jpg',
      'assets/visualspage/plasticoofthesofa-5.jpg',
      'assets/visualspage/virgosgroove.jpg',
      'assets/visualspage/move-1.jpg',
      'assets/visualspage/move-2.jpg',
      'assets/visualspage/cuffit.jpg',
      'assets/visualspage/10.jpg',
      'assets/visualspage/purehoney-1.jpg',
      'assets/visualspage/thique-1.jpg',
      'assets/visualspage/thique-2.jpg',
      'assets/visualspage/thique-3.jpg',
      'assets/visualspage/11.jpg',
      'assets/visualspage/12.jpg',
      'assets/visualspage/13.jpg',
      'assets/visualspage/14.jpg',
      'assets/visualspage/15.jpg',
      'assets/visualspage/16.jpg',
      'assets/visualspage/17.jpg',
      'assets/visualspage/allupinyourmind.jpg',
      'assets/visualspage/americahasaproblem.jpg',
      'assets/visualspage/purehoney-2.jpg',
      'assets/visualspage/purehoney-3.jpg',
      'assets/visualspage/18.jpg',
      'assets/visualspage/19.jpg',
      'assets/visualspage/purehoney-4.jpg',
      'assets/visualspage/20.jpg',
      'assets/visualspage/album-cover-aternative.jpg',
      'assets/visualspage/aliensuperstar.jpg',
      'assets/visualspage/album-cover-1.jpg',
    ];

    const visualsStrip = document.getElementById('visualsStrip');
    const navhint = document.getElementById('navhint');
    let hintHidden = false;

    visuals.forEach((src) => {
      const image = document.createElement('img');
      image.className = 'visuals-photo';
      image.src = src;
      image.alt = '';
      visualsStrip.appendChild(image);
    });

    function hideNavhint() {
      if (hintHidden || !navhint) return;
      hintHidden = true;
      navhint.classList.add('navhint-hidden');
    }

    document.addEventListener('keydown', (event) => {
      if (event.key === 'ArrowRight' || event.key === 'ArrowLeft') hideNavhint();
    });

    document.addEventListener('wheel', (event) => {
      const delta = event.deltaX !== 0 ? event.deltaX : event.deltaY;
      if (delta === 0) return;

      event.preventDefault();
      hideNavhint();
      window.scrollBy({
        left: delta,
        behavior: 'auto',
      });
    }, { passive: false });
  </script>
</body>
</html>
