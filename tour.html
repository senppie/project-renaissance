<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TOUR | PROJECT:RENAISSANCE</title>
  <link rel="icon" type="image/png" href="assets/favicon/favicon-tour.png">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="assets/font/font.css">
  <script src="components/title/title-loader.js"></script>
  <script src="components/navbar/navbar-loader.js"></script>
  <script src="components/homebutton/homebutton-loader.js"></script>
  <script src="components/cart/cart-loader.js"></script>
  <style type="text/tailwindcss">
    @theme {
      --animate-marquee-left: marquee-left 42s linear infinite;
      --animate-marquee-right: marquee-right 42s linear infinite;
    }

    @keyframes marquee-left {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    @keyframes marquee-right {
      0% { transform: translateX(-50%); }
      100% { transform: translateX(0); }
    }

    @layer components {
      .tour-shell { @apply h-screen overflow-hidden bg-black px-0 pt-14 pb-0; }
      .tour-frame { @apply relative flex h-full w-full flex-col overflow-hidden; }
      .tour-row { @apply relative flex min-h-0 flex-1 items-center overflow-hidden py-2; }
      .tour-track { @apply flex w-max gap-16 px-6; }
      .tour-track-left { @apply animate-marquee-left; }
      .tour-track-right { @apply animate-marquee-right; }
      .tour-card { @apply relative flex h-36 w-64 shrink-0 cursor-pointer items-center justify-center overflow-hidden rounded border-2 border-white/5 uppercase tracking-widest transition-transform duration-300 hover:scale-105 focus:outline-none focus:ring-2 focus:ring-white/5 focus:ring-offset-2 focus:ring-offset-black; }
      .tour-card-image { @apply absolute inset-0 h-full w-full object-cover; }
      .visualizer { @apply pointer-events-none fixed inset-0 z-50 flex items-center justify-center bg-zinc-900/30 p-6 opacity-0 backdrop-blur-md transition-opacity duration-200; }
      .visualizer.is-open { @apply pointer-events-auto opacity-100; }
      .visualizer-panel { @apply relative flex h-full max-h-screen w-full max-w-5xl flex-col rounded border-2 border-white/5 bg-zinc-900/20 backdrop-blur-md p-6; }
      .visualizer-close { @apply absolute right-6 top-4 z-10 flex h-8 w-8 items-center justify-center rounded border-2 border-white/5 text-xl text-white cursor-pointer transition hover:bg-white hover:text-black; }
      .visualizer-preview { @apply flex min-h-0 flex-1 w-full items-center justify-center; }
      .visualizer-image { @apply block h-auto max-h-full w-auto max-w-full rounded border-2 border-white/5 object-contain; }
      .visualizer-info { @apply shrink-0 pt-2; }
      .visualizer-meta { @apply text-sm uppercase tracking-widest text-white/60; }
      .visualizer-ui-hidden { @apply pointer-events-none opacity-0; }
    }
  </style>
</head>
<body class="overflow-hidden bg-black text-white select-none">
  <main class="tour-shell">
    <section id="tourRows" class="tour-frame" aria-label="Tour image carousel"></section>
    </section>
  </main>

  <div id="visualizer" class="visualizer" role="dialog" aria-modal="true" aria-label="Image visualizer" aria-hidden="true">
    <div class="visualizer-panel">
      <button id="visualizerClose" class="visualizer-close" type="button" aria-label="Close image visualizer">&times;</button>
      <div class="visualizer-preview">
        <img id="visualizerImage" class="visualizer-image" alt="" />
      </div>
      <div class="visualizer-info">
        <p id="visualizerDate" class="visualizer-meta"></p>
        <p id="visualizerCredit" class="visualizer-meta"></p>
      </div>
    </div>
  </div>

  <script>
    const tourPhotos = [
      { src: 'assets/homepage/tour-bg-01.jpeg', date: '2023-09-01', credit: 'Photo credit: Project Renaissance' },
      { src: 'assets/homepage/tour-bg-02.jpeg', date: '2023-09-02', credit: 'Photo credit: Project Renaissance' },
      { src: 'assets/homepage/tour-bg-03.jpeg', date: '2023-09-03', credit: 'Photo credit: Project Renaissance' },
      { src: 'assets/homepage/tour-bg-04.jpeg', date: '2023-09-04', credit: 'Photo credit: Project Renaissance' },
      { src: 'assets/homepage/tour-bg-05.jpeg', date: '2023-09-05', credit: 'Photo credit: Project Renaissance' },
      { src: 'assets/homepage/tour-bg-06.jpeg', date: '2023-09-06', credit: 'Photo credit: Project Renaissance' },
      { src: 'assets/homepage/tour-bg-07.jpeg', date: '2023-09-07', credit: 'Photo credit: Project Renaissance' },
      { src: 'assets/homepage/tour-bg-08.jpeg', date: '2023-09-08', credit: 'Photo credit: Project Renaissance' },
      { src: 'assets/homepage/tour-bg-09.jpeg', date: '2023-09-09', credit: 'Photo credit: Project Renaissance' },
      { src: 'assets/homepage/tour-bg-10.jpeg', date: '2023-09-10', credit: 'Photo credit: Project Renaissance' },
      { src: 'assets/homepage/tour-bg-11.jpeg', date: '2023-09-11', credit: 'Photo credit: Project Renaissance' },
    ];

    const tourRows = [
      { direction: 'left', cardCount: 6 },
      { direction: 'right', cardCount: 6 },
      { direction: 'left', cardCount: 6 },
      { direction: 'right', cardCount: 6 },
      { direction: 'left', cardCount: 6 },
    ];
    const tourRowsContainer = document.getElementById('tourRows');
    let photoIndex = 0;

    tourRows.forEach(({ direction, cardCount }) => {
      const row = document.createElement('div');
      row.className = 'tour-row';
      row.dataset.direction = direction;

      const track = document.createElement('div');
      track.className = `tour-track tour-track-${direction}`;

      for (let cardIndex = 0; cardIndex < cardCount; cardIndex += 1) {
        const currentPhotoIndex = photoIndex % tourPhotos.length;
        const photo = tourPhotos[currentPhotoIndex];
        const card = document.createElement('button');
        card.className = 'tour-card';
        card.type = 'button';
        card.dataset.photoIndex = String(currentPhotoIndex);

        const image = document.createElement('img');
        image.className = 'tour-card-image';
        image.src = photo.src;
        image.alt = '';
        card.appendChild(image);
        track.appendChild(card);
        photoIndex += 1;
      }

      Array.from(track.children).forEach((card) => track.appendChild(card.cloneNode(true)));
      row.appendChild(track);
      tourRowsContainer.appendChild(row);
    });

    const visualizer = document.getElementById('visualizer');
    const visualizerClose = document.getElementById('visualizerClose');
    const visualizerImage = document.getElementById('visualizerImage');
    const visualizerDate = document.getElementById('visualizerDate');
    const visualizerCredit = document.getElementById('visualizerCredit');
    const visualizerCards = document.querySelectorAll('.tour-card');

    function getNavigationComponents() {
      const cartToggle = document.getElementById('cartToggle');
      return [
        document.getElementById('Navbar'),
        document.getElementById('homeButton'),
        cartToggle ? cartToggle.parentElement : null,
        document.getElementById('cartPanel'),
      ].filter(Boolean);
    }

    function setNavigationVisibility(hidden) {
      getNavigationComponents().forEach((component) => {
        component.classList.toggle('visualizer-ui-hidden', hidden);
        component.setAttribute('aria-hidden', String(hidden));
      });
    }

    function closeVisualizer() {
      visualizer.classList.remove('is-open');
      visualizer.setAttribute('aria-hidden', 'true');
      setNavigationVisibility(false);
    }

    function openVisualizer(photo) {
      visualizerImage.src = photo.src;
      visualizerImage.alt = `${photo.date} - ${photo.credit}`;
      visualizerDate.textContent = photo.date;
      visualizerCredit.textContent = photo.credit;
      visualizer.classList.add('is-open');
      visualizer.setAttribute('aria-hidden', 'false');
      setNavigationVisibility(true);
      visualizerClose.focus();
    }

    visualizerCards.forEach((card) => {
      card.addEventListener('click', () => openVisualizer(tourPhotos[Number(card.dataset.photoIndex)]));
    });

    visualizerClose.addEventListener('click', closeVisualizer);
    visualizer.addEventListener('click', (event) => {
      if (event.target === visualizer) closeVisualizer();
    });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && visualizer.classList.contains('is-open')) closeVisualizer();
    });
  </script>

</body>
