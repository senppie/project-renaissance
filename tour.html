<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TOUR | PROJECT:RENAISSANCE</title>
  <link rel="icon" type="image/png" href="assets/favicon/tour.png">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="assets/font/font.css">
  <script src="components/title/title-loader.js"></script>
  <script src="components/navbar/navbar-loader.js"></script>
  <script src="components/homebutton/homebutton-loader.js"></script>
  <script src="components/cart/cart-loader.js"></script>
  <style type="text/tailwindcss">
    @layer components {
      .tour-strip { @apply relative z-10 flex h-screen w-full flex-row; }
      .tour-photo { @apply block h-screen w-auto max-w-none shrink-0 object-cover; }
      .scroll { @apply overflow-x-scroll overflow-y-hidden }
      .navhint { @apply fixed inline-flex left-1/2 bottom-6 -translate-x-1/2 rounded border-2 border-white/5 bg-zinc-900/20 px-3 py-2 text-sm uppercase tracking-tight text-white backdrop-blur-md transition-all duration-300 z-40 }
      .navhint-hidden { @apply opacity-0 pointer-events-none; }
    }
  </style>
</head>
<body class="bg-black scroll select-none">
  <div id="navhint" class="fixed navhint">Scroll or use the arrow keys to navigate</div>
  <main id="tourStrip" class="tour-strip">
  </main>
  <script>
    const tourPhotos = [
      'assets/tourpage/01.jpg',
      'assets/tourpage/02.jpg',
      'assets/tourpage/03.jpg',
      'assets/tourpage/04.jpg',
      'assets/tourpage/05.jpg',
      'assets/tourpage/06.jpg',
      'assets/tourpage/07.jpg',
      'assets/tourpage/08.jpg',
      'assets/tourpage/09.jpg',
      'assets/tourpage/10.jpg',
      'assets/tourpage/11.jpg',
      'assets/tourpage/12.jpg',
      'assets/tourpage/13.jpg',
      'assets/tourpage/14.jpg',
      'assets/tourpage/15.jpg',
      'assets/tourpage/16.jpg',
      'assets/tourpage/17.jpg',
      'assets/tourpage/18.jpg',
      'assets/tourpage/19.jpg',
      'assets/tourpage/20.jpg',
      'assets/tourpage/21.jpg',
      'assets/tourpage/22.jpg',
      'assets/tourpage/23.jpg',
      'assets/tourpage/24.jpg',
      'assets/tourpage/25.jpg',
      'assets/tourpage/26.jpg',
      'assets/tourpage/27.jpg',
      'assets/tourpage/28.jpg',
      'assets/tourpage/29.jpg',
      'assets/tourpage/30.jpg',
      'assets/tourpage/31.jpg',
      'assets/tourpage/32.jpg',
      'assets/tourpage/33.jpg',
      'assets/tourpage/34.jpg',
      'assets/tourpage/35.jpeg',
      'assets/tourpage/36.jpeg',
      'assets/tourpage/37.jpeg',
      'assets/tourpage/38.jpeg',
      'assets/tourpage/39.jpeg',
      'assets/tourpage/40.jpeg',
      'assets/tourpage/41.jpeg',
      'assets/tourpage/42.jpeg',
      'assets/tourpage/43.jpeg',
      'assets/tourpage/44.jpeg',
      'assets/tourpage/45.jpeg',
    ];

    const tourStrip = document.getElementById('tourStrip');
    const navhint = document.getElementById('navhint');
    let hintHidden = false;

    tourPhotos.forEach((photo) => {
      const image = document.createElement('img');
      image.className = 'tour-photo';
      image.src = photo;
      image.alt = '';
      tourStrip.appendChild(image);
    });

    function hideNavhint() {
      if (hintHidden || !navhint) return;
      hintHidden = true;
      navhint.classList.add('navhint-hidden');
    }

    document.addEventListener('keydown', (event) => {
      if (event.key === 'ArrowRight' || event.key === 'ArrowLeft') hideNavhint();
    });
    document.addEventListener('wheel', (event) => {
      const delta = event.deltaX !== 0 ? event.deltaX : event.deltaY;
      if (delta === 0) return;

      event.preventDefault();
      hideNavhint();
      window.scrollBy({
        left: delta,
        behavior: 'auto',
      });
    }, { passive: false });
  </script>

</body>
</html>
