<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TOUR | PROJECT:RENAISSANCE</title>
  <link rel="icon" type="image/png" href="assets/favicon/favicon-tour.png">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="assets/font/font.css">
  <script src="components/title/title-loader.js"></script>
  <script src="components/navbar/navbar-loader.js"></script>
  <script src="components/homebutton/homebutton-loader.js"></script>
  <script src="components/cart/cart-loader.js"></script>
  <style type="text/tailwindcss">
    @layer components {
      .tour-strip { @apply relative z-10 flex h-screen w-full flex-row; }
      .tour-photo { @apply block h-screen w-auto max-w-none shrink-0 object-cover; }
      .navhint-hidden { @apply opacity-0 pointer-events-none; }
    }
  </style>
</head>
<body class="overflow-x-scroll overflow-y-hidden bg-black text-white select-none">
  <div id="navhint"
    class="fixed inline-flex left-1/2 bottom-6 -translate-x-1/2 rounded border-2 border-white/5 bg-zinc-900/20 px-3 py-2 text-sm uppercase tracking-tight text-white backdrop-blur-md transition-all duration-300 z-40">
    Scroll or use the arrow keys to navigate
  </div>
  <main id="tourStrip" class="tour-strip">
  </main>
  <script>
    const tourPhotos = [
      'assets/tourpage/01stockholm.jpg',
      'assets/tourpage/02brussels.jpg',
      'assets/tourpage/03edinburgh.jpg',
      'assets/tourpage/4a7769417cde9ed41adcd5d5a59611737e8e158c-3161x2000.jpg',
      'assets/tourpage/04paris.jpg',
      'assets/tourpage/5eb61c1aac066cab7919207e1b01b7ef46759cbe-4497x3000.jpg',
      'assets/tourpage/05london.jpg',
      'assets/tourpage/06barcelona.jpg',
      'assets/tourpage/7aaccfbfc417699b46b43f378f0d645a14c1c01c-3000x2000.jpg',
      'assets/tourpage/07marseille.jpg',
      'assets/tourpage/08cologne.jpg',
      'assets/tourpage/09amsterdam.jpg',
      'assets/tourpage/10amsterdam.jpg',
      'assets/tourpage/11warsaw.jpg',
      'assets/tourpage/12philadelphia.jpg',
      'assets/tourpage/13nashville.jpg',
      'assets/tourpage/14louisville.jpg',
      'assets/tourpage/15chicago.jpg',
      'assets/tourpage/16detroit.jpg',
      'assets/tourpage/18boston.jpg',
      'assets/tourpage/19charlotte.jpg',
      'assets/tourpage/20atlanta.jpg',
      'assets/tourpage/21atlanta.jpg',
      'assets/tourpage/22las-vegas.jpg',
      'assets/tourpage/23san-francisco.jpg',
      'assets/tourpage/23tampa.jpg',
      'assets/tourpage/24miami.jpg',
      'assets/tourpage/25st-louis.jpg',
      'assets/tourpage/26phoenix.jpg',
      'assets/tourpage/27vancouver.jpg',
      'assets/tourpage/28seattle.jpg',
      'assets/tourpage/29dallas.jpg',
      'assets/tourpage/30houston.jpg',
      'assets/tourpage/587550bb7960101d62e72f344e80ce384fac8580-3000x2001.jpg',
      'assets/tourpage/tour-bg-01.jpeg',
      'assets/tourpage/tour-bg-02.jpeg',
      'assets/tourpage/tour-bg-03.jpeg',
      'assets/tourpage/tour-bg-04.jpeg',
      'assets/tourpage/tour-bg-05.jpeg',
      'assets/tourpage/tour-bg-06.jpeg',
      'assets/tourpage/tour-bg-07.jpeg',
      'assets/tourpage/tour-bg-08.jpeg',
      'assets/tourpage/tour-bg-09.jpeg',
      'assets/tourpage/tour-bg-10.jpeg',
      'assets/tourpage/tour-bg-11.jpeg',
    ];

    const tourStrip = document.getElementById('tourStrip');
    const navhint = document.getElementById('navhint');
    let hintHidden = false;

    tourPhotos.forEach((photo) => {
      const image = document.createElement('img');
      image.className = 'tour-photo';
      image.src = photo;
      image.alt = '';
      tourStrip.appendChild(image);
    });

    function hideNavhint() {
      if (hintHidden || !navhint) return;
      hintHidden = true;
      navhint.classList.add('navhint-hidden');
    }

    document.addEventListener('keydown', (event) => {
      if (event.key === 'ArrowRight' || event.key === 'ArrowLeft') hideNavhint();
    });
    document.addEventListener('wheel', (event) => {
      const delta = event.deltaX !== 0 ? event.deltaX : event.deltaY;
      if (delta === 0) return;

      event.preventDefault();
      hideNavhint();
      window.scrollBy({
        left: delta,
        behavior: 'auto',
      });
    }, { passive: false });
  </script>

</body>
</html>
